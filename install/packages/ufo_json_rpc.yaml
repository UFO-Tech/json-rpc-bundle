# config/packages/ufo_json_rpc.yaml
ufo_json_rpc:
#  batch:
#    enabled: true         # default
#    process: true         # default if false - inline without parallel
#    process_count: 5      # maximum 10 default 2

#  notification:
#    process: false        # default; true - notifications and $rpc.callback of a single request run in a ufo:rpc:process detached from the HTTP worker
#    process_count: 5      # maximum 10 default 2; when all are busy it runs inline

#  translations:
#    # Method titles/descriptions are read from translations/rpc.<locale>.yaml (base)
#    # and translations/rpc/<group>.<locale>.yaml (overrides for an API group; the group wins over the language).
#    # Don't name a group like a Symfony Translator domain (messages, validators, security, ...):
#    # the Translator scans translations/ recursively and would mix the method keys into that domain.
#    paths:                # extra directories with the same layout, e.g. from an extension via prepend(); the app's translations/ overrides them
#      - '%kernel.project_dir%/vendor/acme/rpc-extension/translations'

  cache:
    ttl: 60
    prefix: 'rpc_cache'
    # pool: 'cache.app'               # Optional cache pool service (e.g. shared Redis) instead of the local filesystem pool

  security:
    protected_api: true               # Protection API requests
    protected_doc: false              # Protection API documentation

    token_name: 'Ufo-RPC-Token'      # Name of the key in the header
    clients_tokens:
      - '%env(resolve:UFO_API_TOKEN)%'      # Token example from .env.local

    # Optional group providers: configure either service or clients_tokens.
    # providers:
    #   user:
    #     service: App\Services\RpcSecurity\UserTokenValidator
    #     api_groups: [general]
    #   internal:
    #     api_groups: [internal]
    #     clients_tokens:
    #       - '%env(resolve:UFO_INTERNAL_API_TOKEN)%'
    #   public:
    #     api_groups: [public]
    #     clients_tokens:
    #       - '%env(resolve:UFO_PUBLIC_API_TOKEN)%'
    # Groups without a provider keep the base token validation.

  # Configuration for API documentation
  docs:
    project_name: 'My Project'
    project_description: ''
    project_version: null
    # Optional response details
    async_dsn_info: false          # Provide information about API that work asynchronously

    validations:
      symfony_asserts: false      # Indicates if an array of Symfony validation constraints is used

  async:
      #      - type: 'amqp'
      #        config:
      #          name: 'rpc_async'
      #          dsn: '%env(resolve:RPC_TRANSPORT_DSN)%'

      #      - type: 'mercure'
      #        config:
      #          name: 'rpc_socket'
      #          dsn: '%env(resolve:MERCURE_PUBLIC_URL)%'
      #          topics_prefix: 'rpc.event.'

